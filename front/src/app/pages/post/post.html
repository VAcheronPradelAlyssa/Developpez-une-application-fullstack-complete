<div class="article-list-header-flex">
  <button mat-raised-button color="primary" class="btn-create" routerLink="/create-post">
    Créer un article
  </button>
  <button mat-stroked-button class="sort-span" (click)="toggleSort()" [attr.aria-label]="sortBy === 'desc' ? 'Trier du plus récent au plus ancien' : 'Trier du plus ancien au plus récent'">
    Trier par
    <mat-icon class="arrow">{{ sortBy === 'desc' ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
  </button>
</div>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
  <p>Chargement...</p>
</div>

<div *ngIf="error" class="error">{{ error }}</div>
<div *ngIf="!loading && posts.length === 0" class="no-post">Aucun article trouvé.</div>
<div *ngIf="!loading && posts.length > 0" class="article-list card-grid">
  <app-card *ngFor="let post of posts"
    [title]="post.title"
    [description]="post.content"
    [meta1]="(post.createdAt | date:'dd/MM/yyyy') || undefined"
    [meta2]="'Auteur : ' + post.authorUsername"
    (click)="goToPost(post.id)">
  </app-card>
</div>
