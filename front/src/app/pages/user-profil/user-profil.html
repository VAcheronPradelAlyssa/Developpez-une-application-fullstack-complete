<div class="profile-container" *ngIf="!loading">
  <h2>Profil utilisateur</h2>

  <form (ngSubmit)="saveProfile()" class="profile-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom d'utilisateur</mat-label>
      <input matInput [(ngModel)]="user.username" name="username" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="user.email" name="email" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" [(ngModel)]="user.password" name="password" autocomplete="new-password">
    </mat-form-field>

    <button mat-raised-button color="primary" class="btn-cr" type="submit" [disabled]="saving">
      Sauvegarder
    </button>

    <div class="success" *ngIf="success">{{ success }}</div>
    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
</div>

<hr />

<div class="subscriptions-container" *ngIf="!loading">
  <h2>Abonnements</h2>

  <div class="subscriptions-list" *ngIf="subscriptions?.length && subscriptions.length > 0; else noSub">
    <app-card *ngFor="let sub of subscriptions"
      [title]="sub.subjectName"
      [description]="sub.description">
      <button mat-raised-button color="warn" class="btn-unsubscribe" type="button" (click)="unsubscribe(sub.subjectId)">
        Se désabonner
      </button>
    </app-card>
  </div>

  <ng-template #noSub>
    <p>Aucun abonnement trouvé.</p>
  </ng-template>
</div>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
  <p>Chargement…</p>
</div>
