<div class="subject-list-container">
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Chargement...</p>
  </div>
  
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="!loading && subjects.length === 0" class="no-subject">Aucun thème</div>
  
  <div class="subjects-grid card-grid" *ngIf="!loading && subjects.length > 0">
    <app-card *ngFor="let subject of subjects"
      [title]="subject.name"
      [description]="subject.description">
      <div class="card-btn-row">
        <button mat-raised-button
                [color]="isSubscribed(subject.id) ? '' : 'primary'"
                [class]="isSubscribed(subject.id) ? 'btn-subscribed' : 'btn-subscribe'"
                (click)="toggleSubscription(subject.id)">
          {{ isSubscribed(subject.id) ? 'Déjà abonné' : "S'abonner" }}
        </button>
      </div>
    </app-card>
  </div>
</div>
