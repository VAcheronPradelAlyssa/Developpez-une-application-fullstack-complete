<div class="subject-list-container">
  <div class="subjects-grid card-grid">
    <app-card *ngFor="let subject of subjects"
      [title]="subject.name"
      [description]="subject.description">
      <div class="card-btn-row">
        <button
          [ngClass]="isSubscribed(subject.id) ? 'btn-subscribed' : 'btn-subscribe'"
          (click)="toggleSubscription(subject.id)">
          {{ isSubscribed(subject.id) ? 'Déjà abonné' : "S’abonner" }}
        </button>
      </div>
    </app-card>
  </div>
</div>
